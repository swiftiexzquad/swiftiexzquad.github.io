<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Let her Finish! — 2009 VMAs</title>
<style>
  @import url("https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Great+Vibes&family=Press+Start+2P&display=swap");
  :root {
    --gold: #e6c36a;
    --gold2: #f8e7b0;
    --ink: #3a2a12;
    --wine: #6b2a22;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    color: var(--ink);
    user-select: none;
    overflow: hidden;
    font-family: "Cinzel", "Times New Roman", serif;
    background:
      radial-gradient(ellipse at 20% 0%, #fff4d4 0%, transparent 50%),
      radial-gradient(ellipse at 90% 100%, #e8c478 0%, transparent 46%),
      linear-gradient(180deg, #f6e7b8 0%, #e2c37a 42%, #c9a05a 100%);
  }
  body::before {
    content: "";
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      radial-gradient(circle at 10% 20%, rgba(255,255,255,.55) 0 2px, transparent 3px),
      radial-gradient(circle at 80% 30%, rgba(255,255,255,.4) 0 1.5px, transparent 3px),
      radial-gradient(circle at 30% 80%, rgba(255,236,180,.5) 0 2px, transparent 3px),
      radial-gradient(circle at 70% 70%, rgba(255,255,255,.35) 0 1px, transparent 2px);
    background-size: 180px 180px, 220px 220px, 160px 160px, 90px 90px;
    opacity: .7;
  }
  #stage {
    position: relative; z-index: 1;
    height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 10px 12px 12px;
    gap: 6px;
  }
  .fearless-mark {
    font-family: "Great Vibes", cursive;
    font-size: clamp(34px, 7vw, 58px);
    color: #6b3a12;
    text-shadow: 0 1px 0 #fff6d4, 0 8px 18px rgba(120,70,10,.18);
    line-height: 1;
    letter-spacing: 1px;
  }
  .submark {
    font-size: 10px;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: #7a4e1c;
    margin-top: -6px;
    margin-bottom: 4px;
  }
  .frame {
    position: relative;
    padding: 14px;
    background:
      linear-gradient(145deg, #f8e7b4, #c4923a 40%, #f3d789 70%, #8a5a18);
    border-radius: 22px;
    box-shadow:
      0 18px 50px rgba(80,40,0,.28),
      inset 0 0 0 2px #fff3c4,
      inset 0 0 0 6px #b8862c;
  }
  .frame::before, .frame::after {
    content: "✦";
    position: absolute;
    color: #fff4cc;
    font-size: 18px;
    text-shadow: 0 0 8px #fff;
  }
  .frame::before { top: 6px; left: 10px; }
  .frame::after { bottom: 6px; right: 10px; }
  canvas {
    display: block;
    width: min(92vw, calc((100vh - 130px) * 0.58), 420px);
    height: auto;
    border-radius: 10px;
    background: #1a0c18;
    touch-action: none;
    cursor: pointer;
    box-shadow: inset 0 0 0 2px #3a2410;
  }
  .foot {
    font-size: 10px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: #7a4e1c;
    opacity: .85;
  }
</style>
</head>
<body>
<div id="stage">
  <div class="fearless-mark">Fearless</div>
  <div class="submark">2009 Video Music Awards • Radio City</div>
  <div class="frame">
    <canvas id="game" width="420" height="720"></canvas>
  </div>
  <div class="foot">tap • click • space to flap</div>
</div>

  img[k].onload = img[k].onerror = () => {

  };

const audio = { ctx:null };
function beep(freq, dur, type="square", vol=0.05) {
  try {
    if (!audio.ctx) audio.ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.ctx.createOscillator();
    const g = audio.ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, audio.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audio.ctx.currentTime + dur);
    o.connect(g); g.connect(audio.ctx.destination);
    o.start(); o.stop(audio.ctx.currentTime + dur);
  } catch(e) {}
}
function stingBey() {
  [523,659,784,1046].forEach((f,i)=> setTimeout(()=>beep(f,0.12,"triangle",0.05), i*70));
}

const GROUND = 72;
const quotes = [
  "I'mma let you finish.",
  "Beyoncé had one of the best videos of all time.",
  "The speech never happened.",
  "Radio City went silent.",
  "Look what you made him do — in 2009.",
  "The moonman slipped away.",
  "You belong with the orchestra pit.",
  "Fearless, until the mic got snatched."
];

let state="boot", taylor, pipes, pickups, particles, score, best, tick;
let chase, bgX, groundX, deadQuote, started, pipeTimer, speed, gap;
let flapFlash, beyLeft, beyBanner, pixelOn=true;
let playTime=0, lastTs=0;

const px = document.createElement("canvas");
px.width = 210; px.height = 360;
const pxctx = px.getContext("2d");

function loadBest(){ try{return parseInt(localStorage.getItem("vma2009Best")||"0",10)||0;}catch(e){return 0;} }
function saveBest(n){ try{localStorage.setItem("vma2009Best",String(n));}catch(e){} }

function resetGame(play){
  taylor={x:170,y:H*0.42,vy:0,rot:0};
  pipes=[]; pickups=[]; particles=[];
  score=0; tick=0; flapFlash=0; chase=0.28;
  bgX=0; groundX=0; started=false; pipeTimer=0;
  speed=150; gap=192; beyLeft=0; beyBanner=0;
  playTime=0; lastTs=performance.now();
  best=loadBest();
  deadQuote=quotes[Math.floor(Math.random()*quotes.length)];
  state = play ? "play" : "title";
}
function startTitle(){ resetGame(false); }

function spawnNotes(x,y,glyph){
  const glyphs=glyph? [glyph,glyph,"✧","✦"] : ["♪","♫","✧","✦"];
  for(let i=0;i<7;i++){
    particles.push({
      x:x+(Math.random()-0.4)*22, y:y+(Math.random()-0.5)*16,
      vx:-1-Math.random()*1.8, vy:-2-Math.random()*2.4,
      life:1, g:glyphs[i%glyphs.length], gold:Math.random()>0.35
    });
  }
}

function spawnPipe(){
  const margin=86;
  const open=margin+Math.random()*(H-GROUND-gap-margin*2);
  const p={x:W+24, open, gap, scored:false, w:76};
  pipes.push(p);
  // occasional Beyoncé pickup after a pillar, in a flyable lane
  if (started && Math.random() < 0.22 && beyLeft===0 && !pickups.length) {
    pickups.push({
      x: p.x + 118,
      y: open + gap*0.5,
      w: 46, h: 70,
      grabbed:false
    });
  }
}

function hitbox(){ return {x:taylor.x-16,y:taylor.y-14,w:36,h:34}; }

function collide(){
  if (beyLeft>0) return null;
  const hb=hitbox();
  if (hb.y<6) return "sky";
  if (hb.y+hb.h>H-GROUND) return "ground";
  for (const p of pipes){
    const botY=p.open+p.gap;
    const inX=hb.x+hb.w>p.x && hb.x<p.x+p.w;
    if (inX && (hb.y<p.open || hb.y+hb.h>botY)) return "pipe";
  }
  return null;
}

function die(reason){
  if (state!=="play") return;
  state="dead";
  chase=1;
  if (score>best){ best=score; saveBest(best); }
  deadQuote = reason==="caught" ? "The Devil took the mic." : quotes[Math.floor(Math.random()*quotes.length)];
  beep(140,0.28,"sawtooth",0.07);
  setTimeout(()=>beep(90,0.4,"square",0.05),90);
}

function grabBey(pk){
  pk.grabbed=true;
  beyLeft=5;
  beyBanner=220;
  chase=Math.max(0.02, chase-0.22);
  spawnNotes(pk.x, pk.y, "★");
  stingBey();
}

function flap(){
  if (audio.ctx && audio.ctx.state==="suspended") audio.ctx.resume();
  if (state==="title"){
    resetGame(true); started=true; taylor.vy=-7.8;
    spawnNotes(taylor.x+20,taylor.y+10);
    beep(520,0.08); return;
  }
  if (state==="dead"){ resetGame(false); beep(330,0.08); return; }
  if (state==="play" && beyLeft===0){
    started=true; taylor.vy=-7.8; flapFlash=1;
    spawnNotes(taylor.x+24,taylor.y+16);
    beep(640+Math.random()*80,0.07);
  }
}

function nextGapCenter(){
  let bestP=null;
  for (const p of pipes){
    if (p.x+p.w > taylor.x-10){ bestP=p; break; }
  }
  if (!bestP) return H*0.42;
  return bestP.open + bestP.gap*0.5;
}

function currentSpeed(){
  // pixels per second — pillars and clock, not frame count
  const fromPipes = score * 14;
  const fromTime = playTime * 7;
  return Math.min(420, 150 + fromPipes + fromTime);
}

function update(dt){
  const step = Math.max(0.2, Math.min(3, dt * 60));
  tick++;
  flapFlash *= Math.pow(0.86, step);
  if (beyBanner>0) beyBanner = Math.max(0, beyBanner - step);
  bgX = (bgX + speed * dt * 0.18) % W;
  groundX = (groundX + speed * dt) % 40;

  for (const pt of particles){
    pt.x += pt.vx * step; pt.y += pt.vy * step; pt.vy += 0.08 * step; pt.life -= 0.02 * step;
  }
  particles=particles.filter(p=>p.life>0);

  if (state==="title"){
    taylor.y=H*0.40+Math.sin(tick*0.06)*10;
    taylor.rot=Math.sin(tick*0.06)*0.1;
    return;
  }

  if (state==="play"){
    if (started){
      playTime += dt;
      speed = currentSpeed();

      if (beyLeft>0){
        const target=nextGapCenter();
        const dy=target-taylor.y;
        taylor.vy = taylor.vy*Math.pow(0.65, step) + Math.max(-6.2, Math.min(6.2, dy*0.085));
        taylor.y += taylor.vy * step;
        taylor.rot = Math.max(-0.25, Math.min(0.25, taylor.vy*0.04));
        if (tick%5===0) spawnNotes(taylor.x-8, taylor.y+8, "★");
      } else {
        taylor.vy += 22.8 * dt;
        if (taylor.vy>11) taylor.vy=11;
        taylor.y += taylor.vy * step;
        taylor.rot = Math.max(-0.55, Math.min(0.9, taylor.vy*0.075));
      }

      pipeTimer += dt;
      const interval = Math.max(0.85, 1.85 - score * 0.045 - playTime * 0.012);
      if (pipeTimer > interval){ spawnPipe(); pipeTimer=0; }

      for (const p of pipes){
        p.x -= speed * dt;
        if (!p.scored && p.x+p.w<taylor.x-8){
          p.scored=true;
          score++;
          chase=Math.max(0.02, chase-0.10);
          if (beyLeft>0){
            beyLeft--;
            beep(990,0.08,"triangle",0.05);
            if (beyLeft===0) beep(1320,0.16,"sine",0.04);
          } else {
            beep(880,0.07,"triangle",0.045);
          }
        }
      }
      pipes=pipes.filter(p=>p.x>-130);

      for (const pk of pickups){
        pk.x -= speed * dt;
        pk.y += Math.sin(tick*0.12)*0.35;
        const hb=hitbox();
        if (!pk.grabbed && hb.x<pk.x+pk.w && hb.x+hb.w>pk.x && hb.y<pk.y+pk.h*0.5 && hb.y+hb.h>pk.y-pk.h*0.5){
          grabBey(pk);
        }
      }
      pickups=pickups.filter(pk=>!pk.grabbed && pk.x>-80);

      chase += (0.049 + score*0.0007) * dt;
      if (beyLeft>0) chase -= 0.096 * dt;
      else if (taylor.vy<0) chase -= 0.019 * dt;
      chase=Math.max(0, Math.min(1.05, chase));
      if (chase>=1) die("caught");

      const why=collide();
      if (why){ chase=Math.min(1, chase+0.32); die(why); }
    }
  }

  if (state==="dead"){
    taylor.vy += 27 * dt;
    taylor.y += taylor.vy * step;
    taylor.rot=Math.min(1.3, taylor.rot+0.04*step);
    if (taylor.y>H-GROUND-18){ taylor.y=H-GROUND-18; taylor.vy=0; }
  }
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function drawBackground(){
  if (img.bg.complete && img.bg.naturalWidth){
    const iw=img.bg.naturalWidth, ih=img.bg.naturalHeight;
    const scale=Math.max(W/iw, H/ih)*1.08;
    const dw=iw*scale, dh=ih*scale;
    const dy=(H-dh)*0.15;
    ctx.drawImage(img.bg, -bgX*0.35, dy, dw, dh);
    ctx.drawImage(img.bg, -bgX*0.35+dw-1, dy, dw, dh);
  } else {
    ctx.fillStyle="#2a1038"; ctx.fillRect(0,0,W,H);
  }
  ctx.fillStyle="rgba(40,0,50,0.18)";
  ctx.fillRect(0,0,W,H);
}

function drawGround(){
  const g=ctx.createLinearGradient(0,H-GROUND,0,H);
  g.addColorStop(0,"#2a1020");
  g.addColorStop(0.25,"#6b2a4a");
  g.addColorStop(1,"#120810");
  ctx.fillStyle=g;
  ctx.fillRect(0,H-GROUND,W,GROUND);
  ctx.fillStyle="#e6c36a";
  ctx.fillRect(0,H-GROUND,W,4);
  ctx.fillStyle="#3a1528";
  for(let x=-groundX;x<W+20;x+=40){
    ctx.fillRect(x,H-GROUND+10,22,8);
  }
  ctx.fillStyle="rgba(230,195,106,0.15)";
  ctx.fillRect(0,H-GROUND-8,W,8);
}

function drawPipe(p){
  const botY=p.open+p.gap;
  const botH=H-GROUND-botY;
  if (img.pipe.complete && img.pipe.naturalWidth){
    ctx.save();
    ctx.translate(p.x+p.w/2, p.open);
    ctx.scale(1,-1);
    ctx.drawImage(img.pipe, -p.w/2, 0, p.w, Math.max(36,p.open));
    ctx.restore();
    ctx.drawImage(img.pipe, p.x, botY, p.w, Math.max(36,botH+6));
  } else {
    ctx.fillStyle="#4b1a6a";
    ctx.fillRect(p.x,0,p.w,p.open);
    ctx.fillRect(p.x,botY,p.w,botH);
    ctx.fillStyle="#e6c36a";
    ctx.fillRect(p.x-3,p.open-14,p.w+6,14);
    ctx.fillRect(p.x-3,botY,p.w+6,14);
  }
}

function drawTaylor(){
  ctx.save();
  ctx.translate(taylor.x, taylor.y);
  ctx.rotate(taylor.rot);
  if (beyLeft>0){
    ctx.shadowColor="#ffe27a";
    ctx.shadowBlur=18;
  }
  const bob=state==="title"?0:Math.sin(tick*0.25)*1.1;
  ctx.imageSmoothingEnabled = false;
  if (img.taylor.complete && img.taylor.naturalWidth){
    ctx.drawImage(img.taylor, -46, -38+bob, 96, 82);
  } else {
    ctx.fillStyle="#fff"; ctx.beginPath(); ctx.ellipse(0,0,26,20,0,0,Math.PI*2); ctx.fill();
  }
  if (flapFlash>0.15){
    ctx.shadowBlur=0;
    ctx.globalAlpha=flapFlash*0.4;
    ctx.strokeStyle="#ffe58a"; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(0,0,40,0,Math.PI*2); ctx.stroke();
  }
  ctx.restore();
}

function drawKanye(){
  const shown = Math.max(0.34, Math.min(1, chase));
  const farX = 52, nearX = taylor.x - 74;
  const kx = farX + (nearX - farX) * shown;
  const ky = Math.min(H - GROUND - 70, taylor.y + 36 + Math.sin(tick * 0.2) * 5);
  const scale = 1.05 + shown * 0.22;
  const kw = 118 * scale, kh = 122 * scale;
  ctx.save();
  ctx.globalAlpha = 0.28 + shown * 0.3;
  ctx.fillStyle = "#ff2a22";
  ctx.beginPath(); ctx.ellipse(kx + 6, ky + 10, 50 * scale, 34 * scale, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.translate(kx, ky);
  ctx.rotate(-0.05 + Math.sin(tick * 0.2) * 0.05);
  ctx.imageSmoothingEnabled = false;
  if (img.kanye.complete && img.kanye.naturalWidth){
    ctx.drawImage(img.kanye, -kw * 0.45, -kh * 0.58, kw, kh);
  } else {
    ctx.fillStyle = "#4a1a12";
    ctx.fillRect(-30, -40, 70, 80);
  }
  ctx.restore();
}

function drawBey(){
  for (const pk of pickups){
    const float=Math.sin(tick*0.12)*4;
    ctx.save();
    ctx.globalAlpha=0.45;
    ctx.fillStyle="#ffe27a";
    ctx.beginPath(); ctx.ellipse(pk.x, pk.y+float, 28, 36, 0,0,Math.PI*2); ctx.fill();
    ctx.restore();
    ctx.imageSmoothingEnabled = false;
    if (img.bey.complete && img.bey.naturalWidth){
      ctx.drawImage(img.bey, pk.x-30, pk.y-50+float, 60, 100);
    }
  }
}

function drawParticles(){
  ctx.save();
  ctx.font="16px serif";
  for (const p of particles){
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.gold?"#ffe08a":"#fff";
    ctx.fillText(p.g,p.x,p.y);
  }
  ctx.restore();
}

function drawHUD(){
  ctx.imageSmoothingEnabled = true;
  const mx=22,my=16,mw=W-44,mh=12;
  roundRect(mx,my,mw,mh,6);
  ctx.fillStyle="rgba(0,0,0,.5)"; ctx.fill();
  const cg=ctx.createLinearGradient(mx,0,mx+mw,0);
  cg.addColorStop(0,"#7cffb2"); cg.addColorStop(.55,"#f0c14b"); cg.addColorStop(1,"#e23a2b");
  ctx.save(); roundRect(mx,my,mw,mh,6); ctx.clip();
  ctx.fillStyle=cg; ctx.fillRect(mx,my,mw*Math.min(1,chase),mh); ctx.restore();
  ctx.strokeStyle="rgba(255,220,140,.7)"; ctx.lineWidth=1.4;
  roundRect(mx,my,mw,mh,6); ctx.stroke();

  ctx.font="600 10px Cinzel, serif";
  ctx.fillStyle="#ffe9b0"; ctx.textAlign="left";
  ctx.fillText("DEVIL DISTANCE", mx, my+24);
  ctx.textAlign="right";
  ctx.fillStyle=chase>0.72?"#ff8b7a":"#fff";
  ctx.fillText(chase>0.85?"HE'S ON STAGE":chase>0.55?"CLOSING IN":"KEEP THE MIC", mx+mw, my+24);

  if (state==="play" && started){
    ctx.textAlign="center";
    ctx.font="800 50px Cinzel, serif";
    ctx.fillStyle="rgba(0,0,0,.35)"; ctx.fillText(String(score), W/2+2, 88);
    ctx.fillStyle="#fff8e8"; ctx.fillText(String(score), W/2, 86);
  }

  if (beyLeft>0){
    ctx.textAlign="center";
    ctx.font="700 13px Cinzel, serif";
    ctx.fillStyle="#ffe27a";
    ctx.fillText("BEYONCÉ CARRY  •  "+beyLeft+" PILLARS LEFT", W/2, 112);
  }
  if (beyBanner>0){
    const a=Math.min(1, beyBanner/40);
    ctx.globalAlpha=a;
    roundRect(16, 128, W-32, 58, 10);
    ctx.fillStyle="rgba(20,8,0,.78)"; ctx.fill();
    ctx.strokeStyle="#e6c36a"; ctx.stroke();
    ctx.fillStyle="#ffe9b0";
    ctx.font="700 11px Cinzel, serif";
    ctx.fillText("I'MMA LET YOU FINISH, BUT", W/2, 152);
    ctx.font="800 12px Cinzel, serif";
    ctx.fillStyle="#fff";
    ctx.fillText("BEYONCÉ HAD ONE OF THE BEST", W/2, 170);
    ctx.fillText("VIDEOS OF ALL TIME", W/2, 186);
    ctx.globalAlpha=1;
  }
}

function drawTitle(){
  ctx.imageSmoothingEnabled = true;
  ctx.textAlign = "center";

  // compact header — leaves the stage open so Kanye stays visible
  roundRect(18, 40, W - 36, 78, 12);
  ctx.fillStyle = "rgba(12,4,10,.82)"; ctx.fill();
  ctx.strokeStyle = "#e6c36a"; ctx.lineWidth = 2; ctx.stroke();
  ctx.font = "800 26px Cinzel, Times New Roman, serif";
  ctx.fillStyle = "#f4d06f";
  ctx.fillText("LET HER FINISH!", W / 2, 74);
  ctx.font = "13px Cinzel, Times New Roman, serif";
  ctx.fillStyle = "#f0d9b8";
  ctx.fillText("FEARLESS ERA  •  2009 VMAs", W / 2, 98);

  // instructions sit on the floor so characters aren't covered
  roundRect(16, H - GROUND - 168, W - 32, 154, 14);
  ctx.fillStyle = "rgba(12,4,10,.88)"; ctx.fill();
  ctx.strokeStyle = "#e6c36a"; ctx.lineWidth = 2; ctx.stroke();

  ctx.font = "15px Cinzel, Times New Roman, serif";
  ctx.fillStyle = "#ffffff";
  ctx.fillText("Angel Taylor keeps the mic.", W / 2, H - GROUND - 132);
  ctx.fillText("Devil Kanye storms from the left.", W / 2, H - GROUND - 110);
  ctx.fillStyle = "#ffe08a";
  ctx.fillText("Catch Beyoncé to auto-fly", W / 2, H - GROUND - 84);
  ctx.fillText("through five award pillars.", W / 2, H - GROUND - 64);

  const pulse = 0.7 + Math.sin(tick * 0.1) * 0.3;
  ctx.globalAlpha = pulse;
  ctx.font = "700 16px Cinzel, Times New Roman, serif";
  ctx.fillStyle = "#fff";
  ctx.fillText("TAP TO START", W / 2, H - GROUND - 34);
  ctx.globalAlpha = 1;
  ctx.font = "12px Cinzel, Times New Roman, serif";
  ctx.fillStyle = "#e8c48a";
  ctx.fillText("best night  •  " + best, W / 2, H - GROUND - 14);
}

function drawDead(){
  ctx.imageSmoothingEnabled = true;
  ctx.fillStyle="rgba(40,0,20,.3)"; ctx.fillRect(0,0,W,H);
  ctx.textAlign="center";
  roundRect(26,208,W-52,258,18);
  ctx.fillStyle="rgba(12,4,8,.76)"; ctx.fill();
  ctx.strokeStyle="#e6c36a"; ctx.lineWidth=2; ctx.stroke();
  ctx.font="800 30px Cinzel, serif";
  ctx.fillStyle="#ff6b5a"; ctx.fillText("MIC SNATCHED", W/2, 254);
  ctx.font="14px Cinzel, serif";
  ctx.fillStyle="#f7e2c0";
  wrapText(deadQuote, W/2, 286, W-110, 20);
  ctx.font="800 42px Cinzel, serif";
  ctx.fillStyle="#fff"; ctx.fillText(String(score), W/2, 348);
  ctx.font="12px Cinzel, serif";
  ctx.fillStyle="#f4d06f";
  ctx.fillText("pillars passed   •   best "+best, W/2, 372);
  const pulse=0.65+Math.sin(tick*0.12)*0.35;
  ctx.globalAlpha=pulse;
  ctx.font="700 14px Cinzel, serif";
  ctx.fillStyle="#fff"; ctx.fillText("TAP TO TAKE THE STAGE AGAIN", W/2, 422);
  ctx.globalAlpha=1;
}

function wrapText(text,x,y,maxW,lh){
  const words=text.split(" ");
  let line="";
  for (const w of words){
    const test=line+w+" ";
    if (ctx.measureText(test).width>maxW){ ctx.fillText(line,x,y); line=w+" "; y+=lh; }
    else line=test;
  }
  ctx.fillText(line,x,y);
}

function drawScanlines(){
  ctx.save();
  ctx.globalAlpha=0.08;
  ctx.fillStyle="#000";
  for (let y=0;y<H;y+=3) ctx.fillRect(0,y,W,1);
  ctx.globalAlpha=0.04;
  ctx.fillStyle="#fff";
  for (let x=0;x<W;x+=4) ctx.fillRect(x,0,1,H);
  ctx.restore();
}

function drawWorld(){
  ctx.clearRect(0,0,W,H);
  drawBackground();
  for (const p of pipes) drawPipe(p);
  drawGround();
  drawBey();
  drawKanye();
  drawTaylor();
  drawParticles();
  drawScanlines();
}

function drawUI(){
  ctx.imageSmoothingEnabled = true;
  drawHUD();
  if (state==="title") drawTitle();
  if (state==="dead") drawDead();
}

function presentPixel(){
  // pixelate the stage only — UI text is drawn crisp afterward
  pxctx.imageSmoothingEnabled = false;
  pxctx.clearRect(0, 0, px.width, px.height);
  pxctx.drawImage(canvas, 0, 0, px.width, px.height);
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(px, 0, 0, W, H);
}

function loop(ts){
  if (!lastTs) lastTs = ts || performance.now();
  const now = ts || performance.now();
  const dt = Math.min(0.05, Math.max(0.001, (now - lastTs) / 1000));
  lastTs = now;
  update(dt);
  drawWorld();
  presentPixel();
  drawUI();
  requestAnimationFrame(loop);
}



canvas.addEventListener("pointerdown", e=>{ e.preventDefault(); flap(); });
window.addEventListener("keydown", e=>{
  if (e.code==="Space"||e.code==="ArrowUp"){ e.preventDefault(); flap(); }
});

resetGame(false);
state="boot";
ctx.fillStyle="#1a0a12"; ctx.fillRect(0,0,W,H);
ctx.fillStyle="#e6c36a"; ctx.textAlign="center";
ctx.font="16px Cinzel, serif";
ctx.fillText("cue the orchestra…", W/2, H/2);
if (assetsReady>=NEED) startTitle();
else setTimeout(()=>{ if(state==="boot") startTitle(); }, 1400);
loop();
</script>
