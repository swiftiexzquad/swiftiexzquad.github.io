<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>JOE vs EMPLOYMENT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1a1523;
      --paper: #f4efe6;
      --gold: #e8c36a;
      --red: #c23b4a;
      --blue: #3d6ea8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background: #0e0c12;
      color: var(--paper);
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
      touch-action: manipulation;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 10px 0 16px;
      background:
        radial-gradient(ellipse at 20% 0%, #2a1a3a 0%, transparent 50%),
        radial-gradient(ellipse at 80% 100%, #1a2038 0%, transparent 45%),
        #0e0c12;
    }
    .wrap {
      width: min(640px, 96vw, calc(100dvh - 170px));
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 12px;
      padding: 4px 2px;
    }
    h1 {
      font-family: "Press Start 2P", monospace;
      font-size: clamp(11px, 2.2vw, 16px);
      letter-spacing: 1px;
      color: #fff;
      line-height: 1.5;
    }
    h1 span { color: var(--gold); }
    .sub { font-size: 12px; opacity: 0.7; margin-top: 4px; }
    .hud {
      text-align: right;
      font-family: "Press Start 2P", monospace;
      font-size: 10px;
      line-height: 1.7;
      color: #d8c9a3;
    }
    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border: 3px solid #3a3148;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,.55), inset 0 0 0 1px #5a4d6e;
      background: #87b8d4;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: pointer;
      touch-action: none;
    }
    .controls {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 8px;
    }
    .controls button {
      font-family: "Press Start 2P", monospace;
      font-size: 11px;
      letter-spacing: 1px;
      border: 3px solid #5a4d6e;
      background: #2a2434;
      color: #fff;
      border-radius: 10px;
      padding: 16px 10px;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    .controls button.jump {
      background: #c23b4a;
      border-color: #e8c36a;
      font-size: 13px;
    }
    .controls button:active { transform: scale(0.98); filter: brightness(1.15); }
    .banner {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%) translateY(-8px);
      background: #1a1523;
      color: #fff;
      font-family: "Press Start 2P", monospace;
      font-size: clamp(7px, 2.1vw, 9px);
      line-height: 1.55;
      padding: 10px 12px;
      border-radius: 6px;
      border: 2px solid var(--gold);
      opacity: 0;
      pointer-events: none;
      white-space: normal;
      text-align: center;
      width: max-content;
      max-width: min(90%, 34ch);
      overflow: visible;
      transition: opacity .2s, transform .2s;
      z-index: 5;
    }
    .banner.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .help {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 12px;
      opacity: 0.7;
      padding: 0 2px 6px;
      flex-wrap: wrap;
    }
    kbd {
      font-family: "Press Start 2P", monospace;
      font-size: 8px;
      background: #2a2434;
      border: 1px solid #5a4d6e;
      padding: 3px 6px;
      border-radius: 4px;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>JOE vs <span>EMPLOYMENT</span></h1>
        <div class="sub">A Chrome-dino-style runner. Jump the applications. Do not get hired.</div>
      </div>
      <div class="hud">
        <div>SCORE <span id="score">00000</span></div>
        <div>BEST <span id="best">00000</span></div>
      </div>
    </header>
    <div class="stage">
      <div class="banner" id="banner"></div>
      <canvas id="game" width="720" height="720"></canvas>
    </div>
    <div class="controls">
      <button type="button" id="btnDuck">DUCK</button>
      <button type="button" class="jump" id="btnJump">JUMP</button>
    </div>
    <div class="help">
      <div><kbd>SPACE</kbd> / <kbd>↑</kbd> / tap / JUMP — jump &nbsp; <kbd>↓</kbd> / DUCK — duck</div>
      <div>Taylor makes it worse. On purpose.</div>
    </div>
  </div>

<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const bannerEl = document.getElementById("banner");

  const W = canvas.width;
  const H = canvas.height;
  const GROUND = H - 88;

  const BEST_KEY = "joe_vs_employment_best";
  let best = 0;
  try { best = Number(localStorage.getItem(BEST_KEY) || 0); } catch (e) {}
  bestEl.textContent = pad(best);

  const state = {
    mode: "menu", // menu | play | dead
    t: 0,
    speed: 6.2,
    dist: 0,
    score: 0,
    gravity: 0.84,
    jumpV: -11.2,
    keys: { jump: false, duck: false, jumpHeld: false },
    jumpBuffer: 0,
    coyote: 0,
    joe: { x: 118, y: GROUND, vy: 0, w: 36, h: 52, duck: false, frame: 0 },
    employment: { x: 18, bob: 0 },
    taylor: { active: false, timer: 0, x: W + 40, wave: 0 },
    obstacles: [],
    particles: [],
    clouds: [],
    papers: [],
    spawnTimer: 80,
    eventTimer: 240,
    eventMult: 1,
    eventName: "",
    night: false,
    flash: 0,
    catchup: 0,
    bannerTimer: 0,
  };

  function pad(n) { return String(Math.floor(n)).padStart(5, "0"); }

  function showBanner(text, ms = 2200) {
    bannerEl.textContent = text;
    bannerEl.classList.add("show");
    state.bannerTimer = ms;
  }

  // ----- simple SFX -----
  let actx = null;
  function beep(freq, dur, type = "square", vol = 0.04) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator();
      const g = actx.createGain();
      o.type = type;
      o.frequency.value = freq;
      g.gain.value = vol;
      o.connect(g); g.connect(actx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.stop(actx.currentTime + dur);
    } catch (e) {}
  }

  // ----- entities -----
  function reset() {
    state.mode = "play";
    state.t = 0;
    state.speed = 6.2;
    state.dist = 0;
    state.score = 0;
    state.eventMult = 1;
    state.eventName = "";
    state.night = false;
    state.flash = 0;
    state.catchup = 0;
    state.spawnTimer = 70;
    state.eventTimer = 280;
    state.obstacles = [];
    state.particles = [];
    state.papers = [];
    state.joe.y = GROUND;
    state.joe.vy = 0;
    state.joe.duck = false;
    state.taylor.active = false;
    state.taylor.timer = 0;
    state.taylor.x = W + 40;
    state.employment.x = 18;
    spawnClouds();
    showBanner("RUN, JOE.");
    beep(520, 0.08); beep(740, 0.12);
  }

  function spawnClouds() {
    state.clouds = [];
    for (let i = 0; i < 6; i++) {
      state.clouds.push({
        x: Math.random() * W,
        y: 28 + Math.random() * 90,
        s: 0.4 + Math.random() * 0.8,
        w: 40 + Math.random() * 50,
      });
    }
  }
  spawnClouds();

  function spawnObstacle() {
    const r = Math.random();
    const flyingBias = state.score > 400 ? 0.28 : 0.16;
    if (r < flyingBias) {
      // mid emails you duck; high emails you run under — jump should not clear them for free
      const band = Math.random() < 0.55 ? GROUND - 52 : GROUND - 90;
      state.obstacles.push({
        type: "email",
        x: W + 20,
        y: band,
        w: 46,
        h: 22,
      });
    } else {
      const kind = Math.random();
      let w, h, label;
      if (kind < 0.45) { w = 28; h = 38; label = "APP"; }
      else if (kind < 0.75) { w = 42; h = 48; label = "RESUME"; }
      else if (kind < 0.9) { w = 56; h = 36; label = "OFFER"; }
      else { w = 34; h = 52; label = "W-2"; }
      // sometimes a double stack
      const cluster = Math.random() < 0.22 && state.score > 250;
      state.obstacles.push({ type: "app", x: W + 20, y: GROUND, w, h, label });
      if (cluster) {
        state.obstacles.push({
          type: "app",
          x: W + 28 + w,
          y: GROUND,
          w: 24 + Math.random() * 16,
          h: 32 + Math.random() * 18,
          label: "NOW",
        });
      }
    }
  }

  function spawnTaylor(reason) {
    state.taylor.active = true;
    state.taylor.timer = 420 + Math.random() * 180;
    state.taylor.x = W + 30;
    state.flash = 12;
    showBanner(reason || "TAYLOR SPAWNED — SPEED UP");
    beep(880, 0.08, "triangle", 0.05);
    beep(1174, 0.16, "triangle", 0.05);
  }

  const EVENTS = [
    {
      name: "ALBUM DROP",
      text: "ALBUM DROP — the internet is unusable",
      apply() { spawnTaylor("ALBUM DROP — Taylor era engaged"); state.eventMult = 1.25; },
    },
    {
      name: "MCDONALD'S IS HIRING",
      text: "McDONALD'S IS HIRING — applications incoming",
      apply() {
        state.eventMult = 1.15;
        for (let i = 0; i < 3; i++) {
          setTimeout(() => {
            if (state.mode === "play") {
              state.obstacles.push({
                type: "app", x: W + 20 + i * 70, y: GROUND,
                w: 30, h: 40 + i * 4, label: "CREW",
              });
            }
          }, i * 280);
        }
      },
    },
    {
      name: "HR WANTS TO CHAT",
      text: "HR WANTS TO “CHAT” — Employment is closing in",
      apply() { state.catchup = 220; state.eventMult = 1.1; },
    },
    {
      name: "QUIET QUITTING",
      text: "QUIET QUITTING — brief mercy",
      apply() { state.eventMult = 0.72; },
    },
    {
      name: "LINKEDIN NOTIFICATION",
      text: "LINKEDIN — someone viewed your profile",
      apply() {
        state.eventMult = 1.12;
        for (let i = 0; i < 2; i++) {
          state.obstacles.push({
            type: "email",
            x: W + 40 + i * 90,
            y: GROUND - 88 - i * 10,
            w: 50, h: 22,
          });
        }
      },
    },
    {
      name: "REPUTATION ERA",
      text: "REPUTATION ERA — look what you made Joe do",
      apply() { state.night = true; state.eventMult = 1.35; spawnTaylor("…ready for it?"); },
    },
    {
      name: "401(k) ENROLLMENT",
      text: "401(k) ENROLLMENT — paper storm",
      apply() {
        for (let i = 0; i < 18; i++) {
          state.papers.push({
            x: W + Math.random() * 200,
            y: Math.random() * (GROUND - 40),
            vy: 0.4 + Math.random(),
            vx: -state.speed * (0.4 + Math.random() * 0.4),
            rot: Math.random() * 6,
            vr: (Math.random() - 0.5) * 0.2,
          });
        }
      },
    },
    {
      name: "ZOOM FROM YOUR MANAGER",
      text: "YOUR MANAGER STARTED A ZOOM",
      apply() {
        state.eventMult = 1.2;
        state.obstacles.push({ type: "email", x: W + 20, y: GROUND - 70, w: 54, h: 26 });
      },
    },
  ];

  function triggerEvent() {
    const ev = EVENTS[Math.floor(Math.random() * EVENTS.length)];
    state.eventName = ev.name;
    state.eventMult = 1;
    ev.apply();
    if (!state.taylor.active || ev.name !== "ALBUM DROP") showBanner(ev.text);
    // events last ~6s then decay
    setTimeout(() => {
      if (state.eventName === ev.name) {
        state.eventMult = 1;
        if (ev.name === "REPUTATION ERA") state.night = false;
      }
    }, 6500);
  }

  // ----- input -----
  function tryJump() {
    const grounded = state.joe.y >= GROUND - 0.8 || state.coyote > 0;
    if (grounded && !state.joe.duck) {
      state.joe.vy = state.jumpV;
      state.joe.y = Math.min(state.joe.y, GROUND);
      state.coyote = 0;
      state.jumpBuffer = 0;
      beep(320, 0.07, "square", 0.03);
      return true;
    }
    return false;
  }

  function requestJump() {
    if (state.mode === "menu" || state.mode === "dead") {
      reset();
      // small hop so the first tap also feels like a start-jump
      state.joe.vy = state.jumpV * 0.82;
      state.jumpBuffer = 0;
      return;
    }
    state.keys.jumpHeld = true;
    if (!tryJump()) state.jumpBuffer = 14;
  }

  function releaseJump() {
    state.keys.jumpHeld = false;
  }

  function bindPress(el, onDown, onUp) {
    if (!el) return;
    const down = (e) => { e.preventDefault(); e.stopPropagation(); onDown(); };
    const up = (e) => { e.preventDefault(); onUp && onUp(); };
    el.addEventListener("pointerdown", down);
    el.addEventListener("pointerup", up);
    el.addEventListener("pointerleave", up);
    el.addEventListener("touchstart", down, { passive: false });
    el.addEventListener("touchend", up, { passive: false });
  }

  window.addEventListener("keydown", (e) => {
    if (["Space", "ArrowUp", "ArrowDown", " "].includes(e.code) || e.key === " ") e.preventDefault();
    if (e.repeat) return;
    if (e.code === "Space" || e.code === "ArrowUp" || e.key === " ") requestJump();
    if (e.code === "ArrowDown") state.keys.duck = true;
  });
  window.addEventListener("keyup", (e) => {
    if (e.code === "Space" || e.code === "ArrowUp" || e.key === " ") releaseJump();
    if (e.code === "ArrowDown") state.keys.duck = false;
  });

  bindPress(canvas, requestJump, releaseJump);
  bindPress(document.getElementById("btnJump"), requestJump, releaseJump);
  bindPress(document.getElementById("btnDuck"), () => { state.keys.duck = true; }, () => { state.keys.duck = false; });

  // whole stage is tappable too (helps in embedded previews)
  bindPress(document.querySelector(".stage"), requestJump, releaseJump);

  // ----- physics -----
  function aabb(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function joeHitbox() {
    const duck = state.joe.duck && state.joe.y >= GROUND - 0.5;
    const h = duck ? 30 : 48;
    return { x: state.joe.x + 8, y: state.joe.y - h + 2, w: 22, h: h - 4 };
  }

  function update(dt) {
    state.t += dt;
    if (state.bannerTimer > 0) {
      state.bannerTimer -= dt * 16.6;
      if (state.bannerTimer <= 0) bannerEl.classList.remove("show");
    }
    if (state.flash > 0) state.flash = Math.max(0, state.flash - dt);

    // clouds always drift
    for (const c of state.clouds) {
      c.x -= (state.mode === "play" ? state.speed : 1.2) * 0.18 * dt;
      if (c.x < -c.w - 20) { c.x = W + 20; c.y = 24 + Math.random() * 100; }
    }

    if (state.mode !== "play") return;

    const taylorBoost = state.taylor.active ? 1.45 : 1;
    const catchBoost = state.catchup > 0 ? 1.08 : 1;
    const ramp = Math.min(8.2, state.dist / 950);
    state.speed = (5.5 + ramp) * taylorBoost * state.eventMult * catchBoost;
    state.dist += state.speed * 0.55 * dt;
    state.score = Math.floor(state.dist / 2);
    scoreEl.textContent = pad(state.score);

    // Joe
    const onGround = state.joe.y >= GROUND - 0.01 && state.joe.vy >= 0;
    if (onGround) state.coyote = 8;
    else if (state.coyote > 0) state.coyote = Math.max(0, state.coyote - dt);
    if (state.jumpBuffer > 0) {
      state.jumpBuffer = Math.max(0, state.jumpBuffer - dt);
      tryJump();
    }
    state.joe.duck = state.keys.duck && onGround;
    if (!onGround) {
      const g = state.keys.jumpHeld && state.joe.vy < 0 ? state.gravity * 0.8 : state.gravity;
      state.joe.vy += g * dt;
      state.joe.y += state.joe.vy * dt;
      if (state.joe.y > GROUND) { state.joe.y = GROUND; state.joe.vy = 0; }
    }
    state.joe.frame += state.speed * 0.12 * dt;

    // Employment bob + lunge
    state.employment.bob += 0.12 * dt;
    if (state.catchup > 0) {
      state.catchup = Math.max(0, state.catchup - dt);
      state.employment.x = Math.min(58, state.employment.x + 0.35 * dt);
    } else {
      state.employment.x += (18 - state.employment.x) * (1 - Math.pow(0.96, dt));
    }

    // Taylor
    if (state.taylor.active) {
      state.taylor.timer -= dt;
      state.taylor.wave += 0.15 * dt;
      state.taylor.x += (200 - state.taylor.x) * (1 - Math.pow(0.94, dt));
      if (state.taylor.timer <= 0) {
        state.taylor.active = false;
        state.taylor.x = W + 40;
        state.night = false;
        if (state.eventName === "REPUTATION ERA" || state.eventName === "ALBUM DROP") {
          state.eventMult = 1;
          state.eventName = "";
        }
        showBanner("Taylor left. Joe is still unemployed. Ideal.");
      }
    } else {
      state.taylor.x = W + 40;
      if (Math.random() < 0.0018 * dt) spawnTaylor("TAYLOR APPEARED");
    }

    // spawn obstacles
    state.spawnTimer -= dt;
    const minGap = Math.max(32, 82 - state.score / 55) / (state.taylor.active ? 1.22 : 1);
    if (state.spawnTimer <= 0) {
      spawnObstacle();
      state.spawnTimer = minGap + Math.random() * 36;
    }

    state.eventTimer -= dt;
    if (state.eventTimer <= 0) {
      triggerEvent();
      state.eventTimer = 320 + Math.random() * 260;
    }

    // move obstacles
    for (const o of state.obstacles) o.x -= state.speed * dt;
    state.obstacles = state.obstacles.filter((o) => o.x > -80);

    for (const p of state.papers) {
      p.x += (p.vx - state.speed * 0.15) * dt;
      p.y += p.vy * dt;
      p.rot += p.vr * dt;
    }
    state.papers = state.papers.filter((p) => p.x > -20 && p.y < H);

    // particles
    for (const p of state.particles) {
      p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    }
    state.particles = state.particles.filter((p) => p.life > 0);

    // dust from Joe
    if (onGround && Math.random() < 0.4 * dt) {
      state.particles.push({
        x: state.joe.x + 6, y: GROUND - 2,
        vx: -1 - Math.random(), vy: -Math.random() * 0.6,
        life: 16 + Math.random() * 10, c: "#c4b496",
      });
    }

    // collisions
    const box = joeHitbox();
    for (const o of state.obstacles) {
      const ob = o.type === "app"
        ? { x: o.x + 4, y: o.y - o.h + 2, w: o.w - 8, h: o.h - 4 }
        : { x: o.x + 4, y: o.y, w: o.w - 8, h: o.h - 2 };
      if (aabb(box, ob)) {
        die();
        return;
      }
    }
  }

  function die() {
    state.mode = "dead";
    beep(140, 0.25, "sawtooth", 0.05);
    beep(90, 0.4, "square", 0.04);
    showBanner("EMPLOYMENT CAUGHT JOE.");
    if (state.score > best) {
      best = state.score;
      try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {}
      bestEl.textContent = pad(best);
      setTimeout(() => showBanner("NEW BEST. STILL HIRED THOUGH."), 900);
    }
    for (let i = 0; i < 28; i++) {
      state.particles.push({
        x: state.joe.x + 18, y: state.joe.y - 24,
        vx: (Math.random() - 0.5) * 6,
        vy: -Math.random() * 5,
        life: 30 + Math.random() * 20,
        c: ["#e8c36a", "#fff", "#c23b4a"][i % 3],
      });
    }
  }

  // ----- draw helpers -----
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawSky() {
    const night = state.night;
    const g = ctx.createLinearGradient(0, 0, 0, H);
    if (night) {
      g.addColorStop(0, "#1a1030");
      g.addColorStop(0.55, "#3a2048");
      g.addColorStop(1, "#5a3a2a");
    } else if (state.taylor.active) {
      g.addColorStop(0, "#c9b6e8");
      g.addColorStop(0.5, "#f0c9d8");
      g.addColorStop(1, "#f3d7a0");
    } else {
      g.addColorStop(0, "#9ec9e6");
      g.addColorStop(0.55, "#d7e6ef");
      g.addColorStop(1, "#e8d7b8");
    }
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // sun / moon
    ctx.beginPath();
    ctx.fillStyle = night ? "#f0e6c8" : "#ffe08a";
    ctx.arc(W - 90, 58, night ? 16 : 22, 0, Math.PI * 2);
    ctx.fill();

    for (const c of state.clouds) {
      ctx.globalAlpha = 0.55;
      ctx.fillStyle = night ? "#6a5a80" : "#fff";
      ctx.beginPath();
      ctx.ellipse(c.x, c.y, c.w, 12 * c.s, 0, 0, Math.PI * 2);
      ctx.ellipse(c.x + 18, c.y - 6, c.w * 0.6, 10 * c.s, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  function drawGround() {
    ctx.fillStyle = state.night ? "#2a2230" : "#6b5340";
    ctx.fillRect(0, GROUND + 2, W, H - GROUND);
    ctx.fillStyle = state.night ? "#3d3344" : "#8a6d52";
    ctx.fillRect(0, GROUND, W, 6);

    // scrolling dashes
    ctx.fillStyle = state.night ? "#5a4a3a" : "#c4a57a";
    const off = (state.dist * 1.4) % 36;
    for (let x = -36; x < W + 36; x += 36) {
      ctx.fillRect(x - off, GROUND + 16, 18, 3);
    }
    // pebbles
    ctx.fillStyle = state.night ? "#4a3c30" : "#5a4332";
    for (let i = 0; i < 14; i++) {
      const x = ((i * 97 + state.dist * 1.4) % (W + 40)) - 20;
      ctx.fillRect(x, GROUND + 28 + (i % 3) * 6, 3 + (i % 3), 2);
    }
  }

  function px(x, y, w, h, c) {
    ctx.fillStyle = c;
    ctx.fillRect(Math.round(x), Math.round(y), w, h);
  }

  function drawJoe() {
    const j = state.joe;
    const duck = j.duck && j.y >= GROUND - 0.5;
    const run = Math.floor(j.frame) % 4;
    const crying = state.taylor.active && !state.night;
    const sobbing = state.taylor.active && state.night;
    ctx.save();
    ctx.translate(j.x + (sobbing ? Math.sin(state.t * 0.9) * 1.5 : 0), j.y);

    ctx.fillStyle = "rgba(0,0,0,.2)";
    ctx.beginPath();
    ctx.ellipse(18, 3, duck ? 16 : 13, 3.5, 0, 0, Math.PI * 2);
    ctx.fill();

    const skin = "#efc3a0";
    const skin2 = "#d9a888";
    const blonde = "#e6c36a";
    const blondeD = "#c9a24e";
    const blondeL = "#f3dd9a";
    const knit = "#cbb79a";
    const knitD = "#b49d7e";
    const pants = "#4a433c";

    if (!duck) {
      const l1 = [2, 10, 2, -2][run];
      const l2 = [-2, 2, 10, 2][run];
      // shoes + legs
      px(10, -2 + Math.max(0, -l1), 7, 4, "#3a332e");
      px(22, -2 + Math.max(0, -l2), 7, 4, "#3a332e");
      px(12, -16, 5, 14 + l1, pants);
      px(22, -16, 5, 14 + l2, pants);
      // sweater
      px(10, -38, 22, 24, knit);
      px(10, -38, 22, 4, knitD);
      px(16, -26, 10, 6, knitD);
      // arm
      const arm = Math.sin(j.frame) * 5;
      px(6, -34 + arm * 0.2, 6, 4, knit);
      px(3, -30 + arm, 5, 5, skin);
      // head
      px(14, -56, 18, 18, skin);
      px(14, -42, 18, 4, skin2);
      // jaw
      px(28, -48, 3, 8, skin);
      // blonde Alwyn hair — swept, short-medium
      px(13, -62, 20, 8, blonde);
      px(12, -58, 6, 10, blonde);
      px(30, -58, 5, 7, blondeD);
      px(16, -64, 12, 3, blondeL);
      px(14, -56, 16, 3, blondeD);
      // sideburn-ish
      px(13, -52, 3, 6, blondeD);
      // brow — dips when he's wrecked
      px(24, sobbing ? -50 : -52, 6, 2, blondeD);
      // eye
      px(25, -49, 5, 4, "#fff");
      px(27, -48, 2, 2, "#5a3c28");
      // nose
      px(30, -46, 2, 3, skin2);
      // mouth
      if (sobbing) {
        px(25, -42, 6, 4, "#8a4a48");
        px(26, -41, 4, 3, "#5a2c30");
      } else if (crying) {
        px(25, -42, 5, 2, "#c48a78");
        px(26, -41, 3, 2, "#a86a68");
      } else {
        px(25, -42, 5, 2, "#c48a78");
      }
      // tears
      if (crying || sobbing) {
        const drip = Math.floor(state.t / 6) % 6;
        px(26, -44, 2, 4 + drip, "#7eb8e8");
        px(26, -40 + drip, 2, 2, "#a8d4f0");
        if (sobbing) {
          px(29, -45, 2, 5 + (drip % 4), "#7eb8e8");
          px(23, -36, 3, 3, "#7eb8e8");
          px(31, -34, 2, 2, "#a8d4f0");
        }
      }
    } else {
      px(6, -22, 32, 16, knit);
      px(34, -24, 14, 14, skin);
      px(34, -28, 14, 6, blonde);
      px(36, -30, 10, 3, blondeL);
      px(42, -20, 4, 3, "#fff");
      px(43, -19, 2, 2, "#5a3c28");
    }

    ctx.restore();
  }

  function drawEmployment() {
    const bob = Math.sin(state.employment.bob) * 2.2;
    ctx.save();
    ctx.translate(state.employment.x, GROUND - 6 + bob);

    ctx.fillStyle = "rgba(0,0,0,.16)";
    ctx.beginPath(); ctx.ellipse(26, 8, 20, 4, 0, 0, Math.PI * 2); ctx.fill();

    // cute rounded suitcase
    ctx.fillStyle = "#c4a06e";
    roundRect(4, -42, 44, 38, 8); ctx.fill();
    ctx.fillStyle = "#b08958";
    roundRect(4, -42, 44, 10, 8); ctx.fill();
    ctx.fillStyle = "#d8b888";
    roundRect(8, -30, 36, 20, 4); ctx.fill();

    // handle
    ctx.strokeStyle = "#7a5a38";
    ctx.lineWidth = 3;
    ctx.lineCap = "round";
    ctx.beginPath(); ctx.arc(26, -46, 8, Math.PI, 0); ctx.stroke();

    // gold clasp
    px(23, -24, 6, 5, "#e8c36a");
    px(24, -23, 4, 3, "#fff2b0");

    // friendly eyes
    px(12, -34, 10, 10, "#fff");
    px(30, -34, 10, 10, "#fff");
    px(12, -34, 10, 2, "#f0e6d8");
    px(30, -34, 10, 2, "#f0e6d8");
    const blink = Math.floor(state.t / 18) % 18 === 0;
    if (blink) {
      px(14, -29, 6, 2, "#5a3c28");
      px(32, -29, 6, 2, "#5a3c28");
    } else {
      px(15, -31, 4, 5, "#5b8f5a");
      px(33, -31, 4, 5, "#5b8f5a");
      px(16, -30, 2, 2, "#fff");
      px(34, -30, 2, 2, "#fff");
    }
    // happy brows
    px(13, -37, 8, 2, "#8a623c");
    px(31, -37, 8, 2, "#8a623c");
    // blush
    px(11, -24, 6, 3, "#f0b4a8");
    px(35, -24, 6, 3, "#f0b4a8");
    // smile
    px(22, -20, 8, 2, "#c27a6a");
    px(21, -21, 2, 2, "#c27a6a");
    px(29, -21, 2, 2, "#c27a6a");

    // little tie
    px(24, -12, 4, 4, "#d45a64");
    px(23, -8, 6, 10, "#d45a64");
    px(24, 2, 4, 4, "#d45a64");
    px(24, -6, 4, 2, "#fff");

    ctx.restore();
  }

  function drawTaylor() {
    if (!state.taylor.active && state.taylor.x > W) return;
    const y = GROUND - 2 + Math.sin(state.taylor.wave) * 2;
    ctx.save();
    ctx.translate(state.taylor.x, y);

    for (let i = 0; i < 7; i++) {
      const a = state.t * 0.16 + i;
      ctx.globalAlpha = 0.45 + Math.sin(a + i) * 0.4;
      px(16 + Math.cos(a * 1.6 + i) * 26, -48 + Math.sin(a * 1.2 + i) * 20, 2, 2, "#fff6b0");
    }
    ctx.globalAlpha = 1;

    const run = Math.floor(state.t * 0.35) % 2;
    const skin = "#f3d2bc";
    const hair = "#f3d56a";
    const hairD = "#e0b84a";
    const hairL = "#ffe9a0";
    const dress = state.night ? "#2a1528" : "#c9a6e0";
    const dressD = state.night ? "#120810" : "#b089d0";

    // legs + heels
    px(14 - run * 5, -14, 5, 12, skin);
    px(22 + run * 5, -14, 5, 12, skin);
    px(12 - run * 5, -2, 7, 3, "#1a1523");
    px(22 + run * 5, -2, 7, 3, "#1a1523");

    // sparkly dress
    px(10, -20, 22, 8, dress);
    px(8, -14, 26, 6, dress);
    px(14, -40, 14, 22, dress);
    px(14, -28, 14, 3, dressD);
    px(16, -36, 3, 3, hairL);
    px(22, -24, 3, 3, "#fff");

    // arm
    px(8, -36, 5, 12, skin);

    // head
    px(14, -58, 16, 16, skin);

    // long Swift hair — crown, waves, long back
    px(12, -66, 20, 10, hair);
    px(11, -62, 6, 14, hair);
    px(28, -62, 6, 18, hair);
    px(30, -48, 6, 22, hairD);
    px(8, -50, 5, 16, hairD);
    px(6, -38, 5, 14, hair);
    px(32, -36, 5, 16, hair);
    px(16, -68, 12, 3, hairL);
    px(13, -58, 14, 3, hairD);

    // bangs / face frame
    px(14, -58, 4, 8, hair);
    px(26, -58, 4, 7, hair);

    // lashes + blue eyes
    px(18, -54, 6, 2, "#1a1523");
    px(26, -54, 5, 2, "#1a1523");
    px(18, -52, 5, 4, "#fff");
    px(26, -52, 4, 4, "#fff");
    px(20, -51, 3, 3, "#3d8fd8");
    px(27, -51, 3, 3, "#3d8fd8");
    px(21, -50, 1, 1, "#1a1523");
    px(28, -50, 1, 1, "#1a1523");

    // red lips
    px(22, -44, 6, 3, "#c23b4a");
    px(23, -43, 4, 2, "#e25a68");

    ctx.fillStyle = "rgba(26,21,35,.78)";
    roundRect(-8, -82, 58, 12, 3); ctx.fill();
    ctx.fillStyle = "#f2d36b";
    ctx.font = "7px 'Press Start 2P', monospace";
    ctx.fillText("TAYLOR", -2, -73);

    ctx.restore();
  }

  function drawObstacle(o) {
    if (o.type === "app") {
      const x = o.x, y = o.y - o.h;
      ctx.fillStyle = "rgba(0,0,0,.15)";
      ctx.fillRect(x + 4, o.y - 2, o.w - 4, 4);
      ctx.fillStyle = "#f4efe6";
      ctx.fillRect(x, y, o.w, o.h);
      ctx.fillStyle = "#e8d9b8";
      ctx.fillRect(x, y, o.w, 7);
      ctx.strokeStyle = "#6b5340";
      ctx.lineWidth = 2;
      ctx.strokeRect(x, y, o.w, o.h);
      // lines of text
      ctx.strokeStyle = "#b9a88a";
      ctx.lineWidth = 1;
      for (let i = 12; i < o.h - 10; i += 5) {
        ctx.beginPath();
        ctx.moveTo(x + 4, y + i);
        ctx.lineTo(x + o.w - 4, y + i);
        ctx.stroke();
      }
      // clip
      ctx.fillStyle = "#8aa0b8";
      ctx.fillRect(x + o.w / 2 - 4, y - 5, 8, 8);
      ctx.font = "6px 'Press Start 2P', monospace";
      ctx.fillStyle = "#c23b4a";
      const lab = o.label || "JOB";
      ctx.fillText(lab.slice(0, 6), x + 3, y + o.h - 5);
    } else {
      // flying email / zoom
      const x = o.x, y = o.y;
      ctx.fillStyle = "#f7f3ea";
      roundRect(x, y, o.w, o.h, 3); ctx.fill();
      ctx.strokeStyle = "#3d6ea8";
      ctx.lineWidth = 2;
      roundRect(x, y, o.w, o.h, 3); ctx.stroke();
      ctx.strokeStyle = "#3d6ea8";
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + o.w / 2, y + o.h * 0.55);
      ctx.lineTo(x + o.w, y);
      ctx.stroke();
      ctx.font = "5px 'Press Start 2P', monospace";
      ctx.fillStyle = "#3d6ea8";
      ctx.fillText("URGENT", x + 4, y + o.h - 5);
    }
  }

  function drawPapers() {
    for (const p of state.papers) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = "#f4efe6";
      ctx.fillRect(-6, -8, 12, 16);
      ctx.strokeStyle = "#b9a88a";
      ctx.strokeRect(-6, -8, 12, 16);
      ctx.restore();
    }
  }

  function drawParticles() {
    for (const p of state.particles) {
      ctx.globalAlpha = Math.max(0, p.life / 30);
      ctx.fillStyle = p.c;
      ctx.fillRect(p.x, p.y, 3, 3);
    }
    ctx.globalAlpha = 1;
  }

  function drawHUD() {
    if (state.taylor.active) {
      ctx.fillStyle = "rgba(26,21,35,.55)";
      roundRect(W / 2 - 120, 8, 240, 22, 4); ctx.fill();
      ctx.fillStyle = "#f2d36b";
      ctx.font = "8px 'Press Start 2P', monospace";
      ctx.textAlign = "center";
      ctx.fillText("TAYLOR ERA  " + Math.ceil(state.taylor.timer / 60) + "s", W / 2, 24);
      ctx.textAlign = "left";
    }

    if (state.mode === "menu") {
      ctx.fillStyle = "rgba(14,12,18,.62)";
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#fff";
      ctx.font = "16px 'Press Start 2P', monospace";
      ctx.textAlign = "center";
      ctx.fillText("JOE vs EMPLOYMENT", W / 2, H / 2 - 50);
      ctx.fillStyle = "#e8c36a";
      ctx.font = "9px 'Press Start 2P', monospace";
      ctx.fillText("jump the applications", W / 2, H / 2 - 24);
      ctx.fillStyle = "#f4efe6";
      ctx.font = "8px 'Press Start 2P', monospace";
      ctx.fillText("SPACE / TAP TO CLOCK OUT", W / 2, H / 2 + 16);
      ctx.fillStyle = "#b9a88a";
      ctx.font = "7px 'Press Start 2P', monospace";
      ctx.fillText("Employment is the suitcase. Taylor is the problem.", W / 2, H / 2 + 44);
      ctx.textAlign = "left";
    }

    if (state.mode === "dead") {
      ctx.fillStyle = "rgba(14,12,18,.45)";
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#fff";
      ctx.font = "14px 'Press Start 2P', monospace";
      ctx.textAlign = "center";
      ctx.fillText("YOU'RE HIRED", W / 2, H / 2 - 28);
      ctx.fillStyle = "#e8c36a";
      ctx.font = "8px 'Press Start 2P', monospace";
      ctx.fillText("score  " + pad(state.score), W / 2, H / 2);
      ctx.fillStyle = "#f4efe6";
      ctx.fillText("SPACE / TAP  —  quit again", W / 2, H / 2 + 28);
      ctx.textAlign = "left";
    }

    if (state.flash > 0) {
      ctx.fillStyle = `rgba(255,255,255,${state.flash / 18})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  function draw() {
    drawSky();
    drawGround();
    drawPapers();
    drawEmployment();
    for (const o of state.obstacles) drawObstacle(o);
    drawTaylor();
    drawJoe();
    drawParticles();
    drawHUD();
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(1.8, (now - last) / 16.667);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
