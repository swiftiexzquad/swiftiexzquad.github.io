<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>swiftiexzquad arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #c8e8f6;
    --foam: #e8f6fb;
    --water: #7ec8e3;
    --deep: #1b4d6e;
    --ink: #163247;
    --tile: rgba(255,255,255,0.78);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    color: var(--ink);
    font-family: Outfit, system-ui, sans-serif;
    background:
      radial-gradient(circle at 18% 12%, rgba(255,255,255,0.7) 0 90px, transparent 140px),
      radial-gradient(circle at 86% 8%, rgba(255,255,255,0.45) 0 70px, transparent 120px),
      linear-gradient(180deg, #d7f1fa 0%, var(--sky) 42%, #9fd4ea 72%, #6bb8d6 100%);
  }
  body::before {
    content: "";
    pointer-events: none;
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      rgba(27,77,110,0.035) 0 1px,
      transparent 1px 4px
    );
  }
  .wrap {
    position: relative;
    z-index: 1;
    max-width: 640px;
    margin: 0 auto;
    padding: 48px 18px 64px;
  }
  header { text-align: center; margin-bottom: 28px; }
  .marquee {
    display: inline-block;
    font-family: "Press Start 2P", monospace;
    font-size: 0.58rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #eff9fd;
    background: var(--deep);
    padding: 8px 12px;
    border: 3px solid #0e2c40;
    box-shadow: 4px 4px 0 #0e2c40, inset 0 0 0 2px #4aa3c7;
    margin-bottom: 16px;
  }
  h1 {
    margin: 0 0 8px;
    font-family: "Press Start 2P", monospace;
    font-size: clamp(1.05rem, 4vw, 1.45rem);
    line-height: 1.45;
    color: var(--deep);
    text-shadow: 3px 3px 0 rgba(255,255,255,0.7);
  }
  .sub { margin: 0; color: #3d6f8a; font-size: 0.95rem; }
  .user { color: #1b4d6e; text-decoration: none; font-weight: 600; }
  .user:hover { text-decoration: underline; }
  .cabinet {
    background: linear-gradient(180deg, rgba(255,255,255,0.55), rgba(232,246,251,0.72));
    border: 4px solid var(--deep);
    box-shadow: 8px 8px 0 rgba(14,44,64,0.28);
    padding: 16px;
  }
  .cabinet-bar {
    height: 8px;
    margin: -16px -16px 16px;
    background: repeating-linear-gradient(90deg, #1b4d6e 0 16px, #4aa3c7 16px 32px);
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  a.game {
    aspect-ratio: 1 / 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    text-decoration: none;
    color: var(--ink);
    background: var(--tile);
    border: 3px solid var(--deep);
    box-shadow: 4px 4px 0 rgba(14,44,64,0.22);
    padding: 16px 12px 14px;
    text-align: center;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  a.game:hover,
  a.game:focus-visible {
    transform: translate(-2px, -2px);
    box-shadow: 6px 6px 0 rgba(14,44,64,0.28);
    outline: none;
  }
  .icon { width: 72px; height: 72px; flex: 0 0 auto; }
  .icon svg { width: 100%; height: 100%; display: block; }
  a.game strong {
    display: block;
    font-size: 0.92rem;
    line-height: 1.25;
    font-weight: 600;
  }
  a.game span {
    display: block;
    font-size: 0.75rem;
    color: #4a738a;
    line-height: 1.35;
    max-width: 160px;
  }
  footer {
    margin-top: 18px;
    text-align: center;
    font-size: 0.75rem;
    color: #3d6f8a;
  }
  @media (max-width: 420px) {
    .grid { gap: 10px; }
    a.game { padding: 12px 8px; }
    a.game strong { font-size: 0.8rem; }
    .icon { width: 58px; height: 58px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="marquee">insert coin</div>
      <h1>Arcade</h1>
      <p class="sub"><a class="user" href="https://x.com/swiftiexzquad">@swiftiexzquad</a></p>
    </header>

    <section class="cabinet">
      <div class="cabinet-bar"></div>
      <div class="grid">
        <a class="game" href="joe-vs-employment.html">
          <div class="icon" aria-hidden="true">
            <svg viewBox="0 0 72 72" fill="none">
              <rect x="8" y="10" width="56" height="50" rx="4" fill="#eef7fb" stroke="#1b4d6e" stroke-width="3"/>
              <rect x="14" y="16" width="28" height="6" fill="#7ec8e3"/>
              <rect x="14" y="26" width="44" height="3" fill="#b7d7e6"/>
              <rect x="14" y="32" width="38" height="3" fill="#b7d7e6"/>
              <rect x="14" y="38" width="20" height="3" fill="#b7d7e6"/>
              <circle cx="50" cy="48" r="10" fill="#1b4d6e"/>
              <path d="M46 48h8M50 44v8" stroke="#e8f6fb" stroke-width="2.5" stroke-linecap="square"/>
            </svg>
          </div>
          <strong>Joe vs Employment</strong>
          <span>survive the listing</span>
        </a>

        <a class="game" href="she-made-sombr-unfollow-me.html">
          <div class="icon" aria-hidden="true">
            <svg viewBox="0 0 72 72" fill="none">
              <rect x="10" y="14" width="52" height="22" rx="3" fill="#eef7fb" stroke="#1b4d6e" stroke-width="3"/>
              <rect x="32" y="21" width="22" height="3" fill="#1b4d6e"/>
              <rect x="32" y="27" width="16" height="3" fill="#9fc9db"/>
              <circle cx="22" cy="25" r="6" fill="#7ec8e3" stroke="#1b4d6e" stroke-width="2"/>
              <rect x="38" y="42" width="22" height="14" rx="2" fill="#1b4d6e"/>
              <path d="M20 56V44h8v4" stroke="#1b4d6e" stroke-width="3" stroke-linejoin="round"/>
              <circle cx="24" cy="38" r="5" fill="#4aa3c7" stroke="#1b4d6e" stroke-width="2"/>
            </svg>
          </div>
          <strong>She Made Sombr Unfollow Me</strong>
          <span>block the follow</span>

          <a class="game" href="onika-burgers.html">
  <div class="icon" aria-hidden="true">
    <svg viewBox="0 0 72 72" fill="none">
      <path d="M16 30c0-12 9-20 20-20s20 8 20 20H16z" fill="#eef7fb" stroke="#1b4d6e" stroke-width="3"/>
      <circle cx="26" cy="22" r="2.2" fill="#7ec8e3"/>
      <circle cx="34" cy="18" r="1.8" fill="#7ec8e3"/>
      <circle cx="44" cy="22" r="2" fill="#7ec8e3"/>
      <rect x="14" y="30" width="44" height="6" rx="2" fill="#4aa3c7" stroke="#1b4d6e" stroke-width="2"/>
      <rect x="15" y="36" width="42" height="7" rx="2" fill="#1b4d6e"/>
      <rect x="14" y="43" width="44" height="6" rx="2" fill="#9fc9db" stroke="#1b4d6e" stroke-width="2"/>
      <path d="M16 49h40c2 8-8 14-20 14S14 57 16 49z" fill="#e8f6fb" stroke="#1b4d6e" stroke-width="3"/>
    </svg>
  </div>
  <strong>Onika Burgers</strong>
  <span>help her munch</span>
</a>
        </a>
      </div>
    </section>

    <footer>games by @swiftiexzquad</footer>
  </div>
</body>
</html>
